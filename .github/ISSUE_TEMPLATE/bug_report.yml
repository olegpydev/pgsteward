name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the tool call you made and the response you got.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: input
    id: pgsteward-version
    attributes:
      label: pgsteward version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: postgres-version
    attributes:
      label: PostgreSQL version
      placeholder: "17.2 (managed / self-hosted)"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Code / Claude Desktop / opencode / Cursor / ..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server log (stderr)
      description: >-
        pgsteward never logs statement text or parameter values, but please
        double-check for anything sensitive before pasting.
      render: text
